<div class="app">
  @if (authService.loggedIn$ | async) {
    <mat-toolbar class="smartrest-toolbar">
      <div class="smartrest-logo-blanco"></div>
      <button mat-raised-button color="primary" (click)="logout()">Salir</button>
    </mat-toolbar>
  }
  <div class="app__contenido">
    <router-outlet />
  </div>
</div>
