<div class="smartrest-fondo-gris"></div>
<section class="mesas-panel">
  <div class="mesas-grid">
    @for (mesa of mesas; track mesa.idMesa) {
      <mat-card class="mesa-card" [class.is-ocupada]="mesa.estado === 'OCUPADA'">
        <mat-card-header>
          <mat-card-title>Mesa {{ mesa.numero }}</mat-card-title>
          <mat-card-subtitle>Capacidad {{ mesa.capacidad }}</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
          <div class="mesa-estado">
            <span class="estado-dot" [class.is-ocupada]="mesa.estado === 'OCUPADA'"></span>
            <mat-icon class="estado-icon mat-symbol" fontSet="material-symbols-outlined">
              {{ mesa.estado === 'OCUPADA' ? 'dine_in' : 'table_restaurant' }}
            </mat-icon>
            <span>{{ mesa.estado }}</span>
          </div>
        </mat-card-content>
        <mat-card-actions>
          <button mat-raised-button color="primary" class="mesa-action" (click)="mesaOnClick(mesa)">
            Entrar
          </button>
        </mat-card-actions>
      </mat-card>
    }
  </div>
</section>
