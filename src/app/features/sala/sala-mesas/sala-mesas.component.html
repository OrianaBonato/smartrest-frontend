<div style="padding: 4rem">
  <div
    style="
      display: grid;
      gap: 2rem;
      justify-content: space-evenly;
      grid-template-columns: repeat(auto-fit, 24rem);
    "
  >
    @for (mesa of mesas; track mesa.idMesa) {
      <button
        matFab
        extended
        style="
          padding: 4rem;
          width: 20rem;
          height: 20rem;
          box-sizing: border-box;
          background-color: #e1e3de;
        "
        [style.background-color]="mesa.estado === 'OCUPADA' ? '#b3cdba' : '#e1e3de'"
        (click)="mesaOnClick(mesa)"
      >
        <div
          style="
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            margin: auto 0;
          "
        >
          <h2>Mesa: {{ mesa.numero }}</h2>
          <div>Capacidad: {{ mesa.capacidad }}</div>
          <div>Estado: {{ mesa.estado }}</div>
        </div>
      </button>
    }
  </div>
</div>
